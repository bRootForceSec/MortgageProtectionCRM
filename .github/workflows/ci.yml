name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # better-sqlite3 has no prebuilt binaries, so it compiles on install. The node-gyp bundled with npm 10
      # doesn't recognise Visual Studio 2026 on the Windows runner; node-gyp 13 does.
      - name: Use a node-gyp that knows Visual Studio 2026 (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          npm install -g node-gyp@13
          echo "npm_config_node_gyp=$(npm root -g)/node-gyp/bin/node-gyp.js" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Secret scan (repo files and built UI)
        run: node scripts/secret-scan.mjs
      - name: Install Chromium for end-to-end tests
        run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results-${{ matrix.os }}
          path: test-results/
          retention-days: 7
