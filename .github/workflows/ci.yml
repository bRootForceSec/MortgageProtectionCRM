name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      # better-sqlite3 has no prebuilt binaries, so it compiles on install. The node-gyp bundled with npm 10
      # doesn't recognise Visual Studio 2026 on the Windows runner; npm 12 bundles node-gyp 13, which does.
      - name: Use npm 12 (Windows)
        if: runner.os == 'Windows'
        run: npm install -g npm@12.2.0
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Secret scan (repo files and built UI)
        run: node scripts/secret-scan.mjs
      - name: Install Chromium for end-to-end tests
        run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-results-${{ matrix.os }}
          path: test-results/
          retention-days: 7

  desktop:
    name: desktop app (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      # Builds are unsigned on purpose: this app is for a small team, downloaded from GitHub Releases.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Use npm 12 (Windows)
        if: runner.os == 'Windows'
        run: npm install -g npm@12.2.0
      - run: npm ci
      # Each push to main becomes a release numbered <major>.<minor>.<run number>, e.g. 0.2.57.
      - name: Number this release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: node scripts/stamp-version.mjs "${{ github.run_number }}"
      - run: npm run build
      - name: Package the desktop app
        run: npx electron-builder --publish never
      - name: Open the packaged app and check it works (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/desktop-smoke.mjs
      - name: Open the packaged app and check it works
        if: runner.os != 'Linux'
        run: node scripts/desktop-smoke.mjs
      - name: Keep the files for the release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/*.dmg
            release/*.zip
            release/*.zip.blockmap
            release/*.AppImage
            release/latest*.yml
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: desktop-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/smoke-*.png
          if-no-files-found: warn
          retention-days: 14

  release:
    name: publish release
    needs: desktop
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Number this release
        run: node scripts/stamp-version.mjs "${{ github.run_number }}"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: files
          merge-multiple: true
      - name: Write the release notes
        run: node scripts/release-notes.mjs > notes.md
      - name: Publish on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          gh release create "v$version" files/* --title "Version $version" --notes-file notes.md --target "$GITHUB_SHA"
